# XcodeGen: .xcodeproj генерится из этого файла (`xcodegen generate`), в репозитории не хранится.
# Временный слот: bundle id и запись App Store Connect от Yes Tax (dev.disify.yestax), с разрешения владельца.
name: Povod
options:
  bundleIdPrefix: dev.disify
  # исходный язык строк — русский (ключи Localizable.xcstrings); язык-запасной для телефонов не из 8 языков — en
  # (CFBundleDevelopmentRegion = en в Resources/Info.plist). Правила — I18N.md
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Povod:
    type: application
    platform: iOS
    sources:
      # App/*.xcstrings (Localizable, InfoPlist) xcodegen сам кладёт в ресурсы — Xcode компилирует их в <язык>.lproj
      - App
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: dev.disify.yestax
        PRODUCT_NAME: Povod
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Povod:
    build:
      targets:
        Povod: all
    archive:
      config: Release
