# CI (lltvutll-max)
# Сборка Повода для iPhone: компиляция → снимки всех экранов в симуляторе (без падений и белых экранов)
# → подпись (ручная: p12 + профиль App Store) → загрузка в App Store Connect (TestFlight).
# Минуты macOS дорогие: один прогон делает всё сразу, снимки уходят в ветку shots/<номер>.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "tools/**"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Загрузить в App Store Connect"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 46
    permissions:
      contents: write
    env:
      SCHEME: Povod
      BUNDLE_ID: dev.disify.yestax
      PROFILE_NAME: YesTax AppStore
      # номер сборки выше уже загруженных в эту запись App Store Connect (у Yes Tax была 3)
      BUILD_BASE: "100"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Инструменты
        run: |
          xcodebuild -version
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          echo "BUILD_NUMBER=$((BUILD_BASE + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV

      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project "$SCHEME.xcodeproj" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > build-sim.log 2>&1 || {
              grep -E "error:|Error:" build-sim.log | sort -u | head -80; tail -30 build-sim.log; exit 1; }
          grep -E "warning:" build-sim.log | sort -u | head -30 || true
          ls build/dd/Build/Products/Debug-iphonesimulator/

      - name: Симулятор
        id: sim
        timeout-minutes: 7
        run: |
          set -e
          LIST=$(xcrun simctl list devices available)
          UDID=$(echo "$LIST" | grep -E "^ +iPhone 17 Pro \(" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          [ -n "$UDID" ] || UDID=$(echo "$LIST" | grep -E "^ +iPhone .*\(" | tail -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "$LIST" | grep "$UDID"
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          xcrun simctl boot "$UDID" || true
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep "$UDID" | grep -q Booted && break; sleep 3
          done
          # Booted appears before SpringBoard and launch services finish starting.
          if ! perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl bootstatus "$UDID" -b; then
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID"
            perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl bootstatus "$UDID" -b
          fi
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/$SCHEME.app

      - name: Снимки экранов
        id: screens
        timeout-minutes: 28
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          mkdir -p shots
          FAIL=0
          to() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # на macOS нет timeout
          shoot() { # имя, аргументы запуска
            local name="$1"; shift
            local t0=$(date +%s)
            local launch_timeout=45
            if [ "$name" = 00-live-login ]; then launch_timeout=60; fi
            # язык по умолчанию — явно английский; сцена со своим -AppleLanguages (ru/de) задаёт язык сама
            local lang="en"
            case " $* " in *" -AppleLanguages "*) lang="" ;; esac
            if [ -n "$lang" ]; then set -- "$@" -AppleLanguages "(en)" -AppleLocale en_US; fi
            if to "$launch_timeout" xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" "$@"; then
              for i in $(seq 1 10); do
                if to 5 xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -F "UIKitApplication:$BUNDLE_ID" >/dev/null; then
                  break
                fi
                sleep 1
              done
              sleep 4
            fi
            alive() { to 10 xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -F "UIKitApplication:$BUNDLE_ID" >/dev/null; }
            # второй шанс: симулятор иногда отвечает медленно — ложное «упало» при живом приложении
            if ! alive; then sleep 5; fi
            if alive &&
              to 20 xcrun simctl io "$UDID" screenshot "shots/$name.png" >/dev/null 2>&1; then
              echo "ok   $name ($(( $(date +%s) - t0 )) с)"
            else
              to 15 xcrun simctl io "$UDID" screenshot "shots/$name-CRASH.png" >/dev/null 2>&1 || true
              if [ "$name" = 00-live-login ]; then
                # живой запуск: проверка процесса через launchctl иногда ложно не видит приложение (снимок при этом — экран входа)
                echo "WARN $name — процесс не найден, снимок в $name-CRASH.png, сборку не останавливаем"
              else
                echo "FAIL $name — приложение не работает (упало)"; FAIL=1
              fi
            fi
          }
          # живой запуск без данных: настоящий сервер отвечает 401 → экран входа
          shoot 00-live-login
          shoot 01-login -fixture -login
          shoot 02-home -fixture
          shoot 03-leads -fixture -screen leads
          shoot 04-lead -fixture -screen lead
          shoot 05-mail -fixture -screen mail
          shoot 06-signals -fixture -screen signals
          shoot 07-settings -fixture -screen settings
          shoot 08-collect -fixture -screen collect
          shoot 09-mail-thread -fixture -screen thread
          shoot 10-mail-compose -fixture -screen compose
          shoot 11-lead-nocontacts -fixture -screen lead3
          shoot 12-folders -fixture -screen folders
          shoot 13-home-select -fixture -screen home-select
          shoot 14-home-delete -fixture -screen home-delete
          shoot 15-leads-select -fixture -screen leads-select
          shoot 16-leads-mail -fixture -screen leads-mail
          shoot 17-leads-delete -fixture -screen leads-delete
          shoot 18-leads-sguardo -fixture -screen leads-sguardo
          shoot 19-leads-sguardo-none -fixture -screen leads-sguardo-none
          shoot 30-onboarding -fixture -onboarding
          shoot 31-leads-hint -fixture -screen leads -hints
          shoot 32-leads-filter -fixture -screen leads-filter
          shoot 33-camp-settings -fixture -screen camp-settings
          shoot 34-camp-delete -fixture -screen camp-delete
          shoot 35-settings-more -fixture -screen settings-more
          shoot 36-leads-empty -fixture -screen leads-empty
          shoot 37-leads-bigfont -fixture -screen leads -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityL
          shoot 38-leads-dark -fixture -screen leads -povod.theme dark
          shoot 39-lead-hint-offline -fixture -screen lead -hints -offline
          # языки интерфейса: список компаний по-английски, настройки по-немецки
          shoot 20-leads-en -fixture -screen leads -AppleLanguages "(en)" -AppleLocale en_US
          shoot 21-settings-de -fixture -screen settings -AppleLanguages "(de)" -AppleLocale de_DE
          shoot 22-folders-server -fixture -screen folders-server
          shoot 23-camp-step -fixture -screen camp-step
          shoot 24-account-delete -fixture -screen account-delete
          # переписка без подсказки «Пишите по-…» (для App Store)
          shoot 09-mail-thread-clean -fixture -screen thread -nohints
          # второй проход: сцены App Store по-русски (данные снимков тоже русские)
          shoot 02-home-ru -fixture -AppleLanguages "(ru)" -AppleLocale ru_RU
          shoot 03-leads-ru -fixture -screen leads -AppleLanguages "(ru)" -AppleLocale ru_RU
          shoot 04-lead-ru -fixture -screen lead -AppleLanguages "(ru)" -AppleLocale ru_RU
          shoot 06-signals-ru -fixture -screen signals -AppleLanguages "(ru)" -AppleLocale ru_RU
          shoot 09-mail-thread-ru -fixture -screen thread -AppleLanguages "(ru)" -AppleLocale ru_RU
          shoot 09-mail-thread-clean-ru -fixture -screen thread -nohints -AppleLanguages "(ru)" -AppleLocale ru_RU
          shoot 15-leads-select-ru -fixture -screen leads-select -AppleLanguages "(ru)" -AppleLocale ru_RU
          # белый/пустой экран сжимается в крошечный PNG — такие снимки помечаем
          for f in shots/*.png; do
            case "$f" in shots/00-live-login*) continue ;; esac
            SZ=$(stat -f%z "$f")
            if [ "$SZ" -lt 40000 ]; then echo "ПУСТОЙ ЭКРАН? $f ($SZ байт)"; FAIL=1; fi
          done
          mkdir -p shots/crashes
          find "$HOME/Library/Logs/DiagnosticReports" -name "Povod*" -newermt "-1 hour" -exec cp {} shots/crashes/ \; 2>/dev/null || true
          for c in shots/crashes/*; do [ -f "$c" ] && { echo "=== $c"; head -80 "$c"; }; done
          ls -la shots
          exit $FAIL

      - name: Снимки в ветку
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b shots
          git add .
          git -c user.name=ci -c user.email=ci@disify.dev commit -qm "снимки прогона $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" shots:shots/$GITHUB_RUN_NUMBER

  build:
    needs: screenshots
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SCHEME: Povod
      BUNDLE_ID: dev.disify.yestax
      PROFILE_NAME: YesTax AppStore
      # номер сборки выше уже загруженных в эту запись App Store Connect (у Yes Tax была 3)
      BUILD_BASE: "100"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Инструменты
        run: |
          xcodebuild -version
          brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
          echo "BUILD_NUMBER=$((BUILD_BASE + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV

      - name: Подпись
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILES_TGZ: ${{ secrets.PROFILES_TGZ }}
        run: |
          set -e
          KC="$RUNNER_TEMP/sign.keychain-db"; KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for D in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$D"; echo "$PROFILES_TGZ" | base64 --decode | tar xz -C "$D"
          done
          ls "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Архив
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          ruby -ryaml -e '
            y = YAML.load_file("project.yml")
            b = y["targets"][ENV["SCHEME"]]["settings"]["base"]
            b["CODE_SIGN_STYLE"] = "Manual"
            b["CODE_SIGN_IDENTITY"] = "Apple Distribution"
            b["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_NAME"]
            File.write("project.yml", y.to_yaml)'
          xcodegen generate
          xcodebuild archive -project "$SCHEME.xcodeproj" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "build/$SCHEME.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > build-archive.log 2>&1 || {
              grep -E "error:|Error:" build-archive.log | sort -u | head -60; tail -40 build-archive.log; exit 1; }
          echo "архив собран, сборка $BUILD_NUMBER"

      - name: Экспорт .ipa
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
          <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "build/$SCHEME.xcarchive" -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export 2>&1 | tail -20
          ls -la build/export
          cd build/export && unzip -q -o *.ipa && codesign -d --entitlements - --xml Payload/*.app 2>/dev/null | plutil -p - || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Payload/*.app/Info.plist

      - name: Загрузка в App Store Connect
        if: github.event_name == 'push' || inputs.upload
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_CONTENT" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f build/export/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --show-progress 2>&1 | tail -25
